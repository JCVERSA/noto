name: Temporary Biology PDF recovery

on:
  workflow_dispatch:
  push:
    branches:
      - temp/biology-pdf-recovery
    paths:
      - ".github/workflows/biology-pdf-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and stage source PDF
        shell: bash
        run: |
          set -euo pipefail
          test -f "Biology 2.pdf"
          mkdir -p export
          cp "Biology 2.pdf" export/"Biology 2.pdf"
          sha256sum export/"Biology 2.pdf" > export/SHA256SUMS.txt
          file export/"Biology 2.pdf" > export/FILE-INFO.txt

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: biology-pdf-recovery
          path: export/
          retention-days: 1
          if-no-files-found: error
