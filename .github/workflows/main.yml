name: Persistent Linux Ubuntu Workspace + SFTP & WebSSH Pro

run-name: "Workspace session #${{ github.run_number }}"

on:
  workflow_dispatch: # Manual unified trigger from the GitHub UI
    inputs:
      webssh:
        description: "Activer WebSSH (ttyd sur loopback, expose via tailscale serve)"
        required: false
        default: true
        type: boolean

# Prevents parallel runs racing on the same cache and burning quota (audit A-7)
concurrency:
  group: workspace-host
  cancel-in-progress: false

# Least privilege: this workflow only needs to check out the repo (LOW-4)
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workspace-host:
    runs-on: ubuntu-latest
    # Reduced from 360 to 120 min: 6h-wall cancelled runs billed ~360 min each (audit A-7)
    timeout-minutes: 120

    steps:
      # Actions pinned by full commit SHA (audit A-8: tag-hijack protection)
      - name: "1. Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      # NOTE (LOW-3): the setup-node step was removed — nothing in this
      # workflow uses Node.js. Re-add it if a future step needs node/npm.

      - name: "2. Restauration du Workspace"
        id: cache-workspace
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Audit A-6: /usr/local and /var/lib/apt/lists removed.
          # MEDIUM: /home/runner is kept (full $HOME persistence semantics),
          # but known junk is excluded to slow cache growth against the
          # 10 GB repo quota (LRU-evicted). Narrow further (e.g. to
          # /home/runner/work only) once the exact persist-set is confirmed.
          path: |
            /home/runner
            /var/cache/apt/archives
            !/home/runner/**/*.log
            !/home/runner/**/*.sock
          key: linux-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-workspace-

      - name: "3. Configuration SSH, SFTP & Utilitaires"
        env:
          # Audit A-2: secret flows via env, never interpolated into the command line
          SECURE_SSH_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          set -euo pipefail
          echo "[SYS] Mise a jour des miroirs APT..."
          sudo apt-get update -qq || true

          # H-1: critical packages fail fast; optional ones are best-effort.
          # One monolithic install aborts EVERYTHING (apt exit 100) when any
          # single package is missing — including openssh-server.
          echo "[SYS] Installation du paquet critique: openssh-server..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openssh-server

          echo "[SYS] Installation des paquets optionnels (au mieux)..."
          for pkg in ttyd unzip wget curl git gnupg build-essential jq socat tmux; do
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$pkg"; then
              echo "[SYS] OK: $pkg"
            else
              echo "[WARN] Paquet optionnel indisponible, ignore: $pkg"
            fi
          done

          # LOW-5: chpasswd's `user:password` format cannot represent ':'.
          # Fail with a clear message instead of setting a broken password.
          # (An empty/unset secret also fails here instead of emptying the password.)
          if [ -z "${SECURE_SSH_PASS:-}" ]; then
            echo "::error::Secret SFTP_PASS manquant ou vide."
            exit 1
          fi
          case "$SECURE_SSH_PASS" in
            *:*)
              echo "::error::SFTP_PASS ne doit pas contenir ':' (limite du format chpasswd)."
              exit 1
              ;;
          esac

          echo "[SYS] Configuration de l'acces distant SSH/SFTP..."
          printf 'runner:%s' "$SECURE_SSH_PASS" | sudo chpasswd
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          # LOW-2: minimal sshd hardening. Password auth stays (required by
          # design; exposure is limited to the Tailscale tailnet) — prefer
          # SSH keys, see README.
          printf 'PermitEmptyPasswords no\nMaxAuthTries 3\n' | sudo tee /etc/ssh/sshd_config.d/90-workspace.conf >/dev/null
          sudo sshd -t
          sudo systemctl restart ssh

          # H-2 readiness gate: fail fast if sshd did not come up.
          if ! sudo systemctl is-active --quiet ssh; then
            echo "::error::sshd ne tourne pas apres redemarrage."
            exit 1
          fi
          echo "[OK] sshd actif."

          mkdir -p /home/runner/.fcc

      - name: "4. Connexion au Reseau Prive Tailscale"
        id: tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: "5. Verification Tailscale"
        run: |
          set -euo pipefail
          # H-2 readiness gate: fail fast if the tailnet did not come up.
          TS_IP="$(tailscale ip -4)"
          echo "[OK] Tailscale actif, IP: $TS_IP"

      - name: "6. Lancement du Workspace Core & Auto-Save"
        env:
          SECURE_SSH_PASS: ${{ secrets.SFTP_PASS }}
          ENABLE_WEBSSH: ${{ inputs.webssh }}
        run: |
          set -euo pipefail
          if [ "${ENABLE_WEBSSH:-true}" = "true" ]; then
            # ttyd on loopback behind tailscale serve TLS (audit A-5)
            # LOW-1 note: the password is passed via `-c` (visible in the local
            # process table). Accepted risk: single-tenant ephemeral runner,
            # single user, tailnet-only exposure. Revisit if ttyd gains a
            # credential-file option.
            ttyd -i 127.0.0.1 -p 7681 -c "runner:$SECURE_SSH_PASS" bash > /home/runner/ttyd.log 2>&1 &
            sudo tailscale serve --bg 7681 || echo "[WARN] tailscale serve indisponible; ttyd reste sur 127.0.0.1:7681."

            # H-2 readiness gate: fail fast if ttyd did not come up.
            sleep 2
            if ! pgrep -x ttyd >/dev/null; then
              echo "::error::ttyd n'a pas demarre — voir ttyd.log"
              tail -n 20 /home/runner/ttyd.log || true
              exit 1
            fi
            if ! ss -ltn | grep -qF '127.0.0.1:7681'; then
              echo "::error::ttyd ne repond pas sur 127.0.0.1:7681"
              exit 1
            fi
            echo "[OK] ttyd a l'ecoute sur 127.0.0.1:7681."
          else
            echo "[SYS] WebSSH desactive (input webssh=false)."
          fi

          echo "========================================================="
          echo "WORKSPACE LINUX ACTIF & INTERCONNECTE VIA TAILSCALE"
          echo "========================================================="
          echo "Acces WebSSH   : https://<machine-name>.<tailnet>.ts.net (TLS via tailscale serve)"
          echo "Acces SFTP/SSH : VS Code sur l'IP Tailscale (User: runner)"
          TS_IP=$(tailscale ip -4 || echo "Inconnue")
          echo "IP Tailscale detectee : $TS_IP"
          echo "========================================================="
          echo " Failsafes :"
          echo " -> Arret controle : cree le fichier 'stop.txt'"
          echo " -> Fermeture forcee (GitHub Cancel) : Auto-Save via Signal Trap"
          echo "========================================================="

          # Session summary on the run page (connection details at a glance).
          {
            echo "## Workspace session #${GITHUB_RUN_NUMBER:-?}"
            echo ""
            echo "- **Tailscale IP:** \`$TS_IP\`"
            echo "- **SSH/SFTP:** \`runner@$TS_IP\`"
            if [ "${ENABLE_WEBSSH:-true}" = "true" ]; then
              echo "- **WebSSH:** \`https://<machine-name>.<tailnet>.ts.net\` (TLS via tailscale serve)"
            else
              echo "- **WebSSH:** desactive (input webssh=false)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f /home/runner/stop.txt
          touch /home/runner/keepalive.txt

          trigger_auto_save() {
            echo -e "\n[ALERT] Arret ou annulation detecte par l'infrastructure GitHub !"
            echo "[AUTO-SAVE] Liberation des verrous et destruction de ttyd..."
            sudo killall ttyd || true
            # LOW-6: best-effort cosmetic teardown — the ephemeral host is
            # destroyed after the job either way.
            sudo tailscale serve --https=443 off || true
            rm -f /home/runner/stop.txt
            rm -f /home/runner/keepalive.txt

            echo "[AUTO-SAVE] Correctif de permissions sur le cache APT..."
            sudo chown -R runner:runner /var/cache/apt/archives || true

            echo "[AUTO-SAVE] Environnement pare pour la sauvegarde d'etat."
            exit 0
          }

          trap trigger_auto_save SIGTERM SIGINT

          while [ -f /home/runner/keepalive.txt ]; do
            if [ -f "/home/runner/stop.txt" ]; then
              echo "[STOP] Signal d'arret manuel detecte depuis l'espace de travail."
              break
            fi
            sleep 10 &
            wait $!
          done

          echo "[SHUTDOWN] Execution de la fermeture standard du systeme."
          sudo killall ttyd || true
          sudo tailscale serve --https=443 off || true
          rm -f /home/runner/keepalive.txt
          rm -f /home/runner/stop.txt

          echo "[SHUTDOWN] Correctif final de permissions pour la sauvegarde du cache..."
          sudo chown -R runner:runner /var/cache/apt/archives || true
          echo "[SHUTDOWN] Session cloturee avec succes."
